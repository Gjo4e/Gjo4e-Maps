<!doctype html>
<html lang="mk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151027"><title>GTA Macedonia • Neon GPS V6</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#151027;color:white}#map{position:fixed;inset:0;background:#1a1431}.leaflet-container{background:#1a1431}.leaflet-tile-pane{filter:grayscale(1) invert(1) hue-rotate(190deg) brightness(.77) contrast(1.15)}.leaflet-control-attribution{font-size:9px!important;background:#161326cc!important;color:#ddd!important}.leaflet-control-attribution a{color:#8adfff!important}.leaflet-control-zoom{display:none}.top{position:fixed;z-index:1000;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}.brand,.search,.panel,.actions,.bottom{pointer-events:auto;box-shadow:0 10px 35px #08051499;backdrop-filter:blur(18px)}.brand{align-self:flex-start;border:1px solid #e16bff66;border-radius:13px;background:#16132ddd;padding:8px 13px;font-size:12px;letter-spacing:2px;font-weight:900;color:#ff86df}.brand b{color:#75e5ff}.search{display:flex;align-items:center;gap:8px;background:#17142df0;border:1px solid #a665d966;border-radius:18px;padding:7px}.search input{flex:1;min-width:0;background:transparent;border:0;color:white;font-size:16px;outline:0;padding:9px}.search button,.actions button,.bottom button,.panel button{background:#302448;color:#fff;border:1px solid #ac6cda70;border-radius:12px;padding:10px;cursor:pointer;font-size:15px}.search button{background:#dc4cbd;color:#fff;font-weight:800}.panel{display:none;background:#17142df2;border:1px solid #ad63d077;border-radius:16px;padding:12px;max-height:32vh;overflow:auto}.panel.show{display:block}.result{display:block;width:100%;text-align:left;background:transparent!important;border:0!important;border-bottom:1px solid #ffffff20!important;border-radius:0!important;padding:11px 5px!important}.result small{display:block;color:#b7aaca;margin-top:3px}.actions{position:fixed;z-index:1000;right:12px;bottom:calc(130px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:#17142ddd;border:1px solid #8e6bca55;border-radius:18px;padding:7px}.actions button{font-size:21px;width:45px;height:45px;padding:6px}.bottom{position:fixed;z-index:1000;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;border-radius:20px;background:#17142df0;border:1px solid #e16bff66;padding:12px}.status{font-size:13px;color:#d8cce8;min-height:19px}.dest{font-size:16px;font-weight:800;margin:4px 0 9px}.controls{display:flex;gap:8px}.controls button{flex:1;font-weight:750}.controls .primary{background:linear-gradient(110deg,#e047b7,#814de5);border:0}.route{color:#79e7ff;font-weight:800;font-size:14px;margin-top:6px}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#251b3e;color:white}.leaflet-popup-content button{background:#dc4cbd;color:white;border:0;border-radius:8px;padding:8px}.marker{width:19px;height:19px;border:3px solid white;border-radius:50%;background:#69ddff;box-shadow:0 0 0 9px #65d8ff33,0 0 22px #4ae5ff}.pin{font-size:26px;filter:drop-shadow(0 0 7px #ec4eea)}@media(min-width:750px){.top{right:auto;width:390px}.bottom{right:auto;width:390px}.actions{bottom:25px}}
</style></head><body><div id="map"></div><div class="top"><div class="brand">GTA <b>MACEDONIA</b> • NEON GPS <small style='color:#83f7cd;letter-spacing:0'>V6</small></div><div class="search"><input id="q" placeholder="Пребарај град, улица, место..." autocomplete="off"><button id="searchBtn">Барај</button></div><div class="panel" id="results"></div></div><div class="actions"><button id="locate" title="Мојата локација">⌖</button><button id="follow" title="Следи ме">➤</button><button id="zoomIn" title="Зумирај">＋</button><button id="zoomOut" title="Одзумирај">－</button><button id="faves" title="Омилени">★</button></div><div class="bottom"><div class="status" id="status">Допрете на мапата за да изберете дестинација.</div><div class="dest" id="destination">📍 Избери дестинација</div><div class="controls"><button class="primary" id="navigate">🚗 Рута</button><button id="save">☆ Зачувај</button><button id="clear">✕ Исчисти</button></div><div class="route" id="routeInfo"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const $=id=>document.getElementById(id);const mkBounds=L.latLngBounds([40.78,20.42],[42.39,23.06]);const map=L.map('map',{zoomControl:false,maxBounds:mkBounds.pad(.12),maxBoundsViscosity:1,minZoom:7}).setView([41.62,21.72],8);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);
let destination=null,destMarker=null,position=null,userMarker=null,accuracyCircle=null,routeLine=null,watchId=null,following=false;
const status=s=>$('status').textContent=s;const favorites=()=>JSON.parse(localStorage.getItem('gta-mk-favs')||'[]');
function setDestination(lat,lng,name){destination={lat,lng,name:name||'Избрана точка'};if(destMarker)map.removeLayer(destMarker);destMarker=L.marker([lat,lng],{icon:L.divIcon({html:'<span class="pin">📍</span>',className:'',iconSize:[28,35],iconAnchor:[14,33]})}).addTo(map);$('destination').textContent='📍 '+destination.name;$('routeInfo').textContent='';if(routeLine){map.removeLayer(routeLine);routeLine=null}status('Дестинацијата е поставена. Притисни „Рута“.');}
map.on('click',e=>setDestination(e.latlng.lat,e.latlng.lng,'Точка на мапата'));
function geoError(e){const reasons={1:'Локацијата е одбиена. Дозволи Location за оваа HTTPS страница во Chrome.',2:'GPS позицијата моментално не е достапна.',3:'GPS барањето истече. Пробај повторно.'};status(reasons[e.code]||'GPS грешка.');}
function gps(){if(!window.isSecureContext){status('GPS бара HTTPS адреса, не content://Downloads.');return}if(!navigator.geolocation){status('Прелистувачот нема GPS поддршка.');return}if(watchId!==null){following=true;if(position)map.setView(position,16);return}status('Барам GPS позиција… дозволи пристап кога ќе те праша Chrome.');watchId=navigator.geolocation.watchPosition(p=>{position=[p.coords.latitude,p.coords.longitude];if(!userMarker){userMarker=L.marker(position,{icon:L.divIcon({html:'<div class="marker"></div>',className:'',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map)}else userMarker.setLatLng(position);if(accuracyCircle)map.removeLayer(accuracyCircle);accuracyCircle=L.circle(position,{radius:p.coords.accuracy,color:'#64dbff',fillColor:'#64dbff',fillOpacity:.08,weight:1}).addTo(map);if(following)map.setView(position,Math.max(15,map.getZoom()));status('GPS активен • точност околу '+Math.round(p.coords.accuracy)+' m');},e=>{geoError(e);if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}},{enableHighAccuracy:true,maximumAge:5000,timeout:18000});following=true}
$('locate').onclick=gps;$('follow').onclick=()=>{following=!following;if(following){if(position)map.setView(position,16);else gps()}status(following?'Следење на позицијата е вклучено.':'Следење на позицијата е исклучено.')};map.on('dragstart',()=>following=false);$('zoomIn').onclick=()=>map.zoomIn();$('zoomOut').onclick=()=>map.zoomOut();
async function search(){const q=$('q').value.trim();if(!q)return;const panel=$('results');panel.classList.add('show');panel.textContent='Пребарувам…';try{const u='https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=8&countrycodes=mk&q='+encodeURIComponent(q);const r=await fetch(u);if(!r.ok)throw Error('Search');const data=await r.json();panel.replaceChildren();if(!data.length){panel.textContent='Нема резултати во Македонија.';return}data.forEach(x=>{const b=document.createElement('button');b.className='result';b.textContent=x.display_name.split(',').slice(0,3).join(', ');b.onclick=()=>{const lat=+x.lat,lng=+x.lon;setDestination(lat,lng,x.name||x.display_name.split(',')[0]);map.setView([lat,lng],15);panel.classList.remove('show')};panel.appendChild(b)})}catch(e){panel.textContent='Пребарувањето не е достапно. Провери интернет.'}}
$('searchBtn').onclick=search;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
$('navigate').onclick=async()=>{if(!destination){status('Прво избери дестинација.');return}if(!position){status('Прво вклучи GPS со копчето ⌖.');gps();return}status('Пресметувам рута…');try{const url='https://router.project-osrm.org/route/v1/driving/'+position[1]+','+position[0]+';'+destination.lng+','+destination.lat+'?overview=full&geometries=geojson';const r=await fetch(url);if(!r.ok)throw Error('Routing');const d=await r.json();if(!d.routes?.length)throw Error('No route');if(routeLine)map.removeLayer(routeLine);const route=d.routes[0];routeLine=L.geoJSON(route.geometry,{style:{color:'#74e8ff',weight:6,opacity:.9}}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[65,65]});$('routeInfo').textContent=(route.distance/1000).toFixed(1)+' km • околу '+Math.ceil(route.duration/60)+' мин';status('Рутата е пресметана. Ова не е навигација со сообраќај во живо.')}catch(e){status('Не може да се пресмета рута сега. Провери интернет и пробај пак.')}}
$('save').onclick=()=>{if(!destination){status('Избери дестинација за зачувување.');return}const a=favorites();if(!a.some(x=>Math.abs(x.lat-destination.lat)<.00001&&Math.abs(x.lng-destination.lng)<.00001)){a.push(destination);localStorage.setItem('gta-mk-favs',JSON.stringify(a))}status('Дестинацијата е зачувана на овој уред.')};
$('faves').onclick=()=>{const panel=$('results');panel.replaceChildren();panel.classList.toggle('show');const a=favorites();if(!a.length){panel.textContent='Немаш зачувани локации.';return}a.forEach(x=>{const b=document.createElement('button');b.className='result';b.textContent='★ '+x.name;b.onclick=()=>{setDestination(x.lat,x.lng,x.name);map.setView([x.lat,x.lng],14);panel.classList.remove('show')};panel.appendChild(b)})};
$('clear').onclick=()=>{destination=null;if(destMarker)map.removeLayer(destMarker);if(routeLine)map.removeLayer(routeLine);destMarker=null;routeLine=null;$('destination').textContent='📍 Избери дестинација';$('routeInfo').textContent='';status('Допрете на мапата за нова дестинација.')};
</script></body></html>
